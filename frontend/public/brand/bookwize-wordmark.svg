<svg xmlns="http://www.w3.org/2000/svg" width="760" height="150" viewBox="0 0 760 150" fill="none">
  <title>BookWize logo</title>
  
  <defs>
    <linearGradient id="blueGrad" x1="82" y1="70" x2="178" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B2E72"/>
      <stop offset="1" stop-color="#1454C8"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="78" y1="34" x2="173" y2="126" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#13B8B4"/>
      <stop offset="1" stop-color="#0A9F9B"/>
