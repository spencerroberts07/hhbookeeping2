  </defs>
  
  <style>
    .word { font-family: Inter, "Aptos Display", "Segoe UI", Arial, sans-serif; font-weight: 800; letter-spacing: -4px; }
    .tag { font-family: Inter, Aptos, "Segoe UI", Arial, sans-serif; font-weight: 700; letter-spacing: 6px; }
  </style>

  
  <text x="20" y="112" class="word" font-size="96" fill="#0B2E72">Book</text>
  <text x="272" y="112" class="word" font-size="96" fill="#13B8B4">Wize</text>
  
